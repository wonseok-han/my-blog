<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="b04"><feGaussianBlur stdDeviation="0.4"/></filter>
    <filter id="b12"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="b18"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="200" r="240" fill="url(#haze)"/>

  <!-- 개념 단어들: 중앙을 둘러싼 수식어들 -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700">
    <text x="146" y="120" font-size="30" fill="#93c5fd" opacity="0.9" transform="rotate(-7 146 120)">prompt</text>
    <text x="318" y="66" font-size="15" fill="#7a7a90" opacity="0.5" transform="rotate(3 318 66)" filter="url(#b18)">vibe coding</text>
    <text x="416" y="122" font-size="26" fill="#86efac" opacity="0.85" transform="rotate(5 416 122)" filter="url(#b04)">context</text>
    <text x="104" y="242" font-size="21" fill="#67e8f9" opacity="0.7" transform="rotate(8 104 242)" filter="url(#b12)">agentic</text>
    <text x="430" y="248" font-size="29" fill="#fdba74" opacity="0.9" transform="rotate(-6 430 248)">harness</text>
    <text x="176" y="340" font-size="27" fill="#c4b5fd" opacity="0.8" transform="rotate(-5 176 340)" filter="url(#b04)">loop</text>
    <text x="392" y="342" font-size="25" fill="#fda4af" opacity="0.85" transform="rotate(4 392 342)">graph</text>
  </g>

  <!-- 중앙: AI ENGINEERING 락업 -->
  <text x="300" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="112" font-weight="800" fill="url(#aiGrad)" text-anchor="middle" letter-spacing="4">AI</text>
  <text x="300" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="600" fill="#9494ab" opacity="0.6" text-anchor="middle" letter-spacing="11">ENGINEERING</text>
</svg>
